<!--
  Master artwork for badge-72.png — the small monochrome glyph Android puts in
  the status bar beside a notification.

  **White on transparent, and no background rect**, which is the opposite of
  every other icon here. Android ignores the colours in a badge entirely: it
  takes the alpha channel as a mask and tints it with the system accent. A badge
  drawn on the abyss arrives as a solid tinted square with a faint sun ghosted
  in it — the background becomes the glyph.

  For the same reason the centre is **cut out rather than filled**. Elsewhere
  the hollow is painted #0f1620 so the mark survives on a light surface; here
  anything painted is opaque, so the ring is drawn as a stroke alone and the
  hole stays transparent.

  72px because that is what `manifest.ts` asks for and what Android expects.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g transform="translate(36,36) scale(0.45)">
    <g fill="#ffffff">
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(45)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(90)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(135)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(180)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(225)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(270)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(315)"/>
    </g>
    <circle r="5.5" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
