<!--
  Master artwork for the `purpose: "any"` PNGs, at 512.

  Identical to app/icon.svg. It exists separately because that one is consumed
  by Next as a favicon and this one is the source the PNGs in this directory are
  rasterised from — see docs/build-plan.md for the command. Keeping them as two
  files means regenerating the PNGs never touches the favicon, and vice versa.

  #34485f is --ds-blue-fantastic (the `.ds-navbar` surface, not the abyss behind
  it) and #ffb162 is --ds-burning-flame, both inlined because nothing resolves a
  CSS variable inside a standalone asset. `app/icon.svg` argues the colour
  choice at length.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#34485f"/>
  <g transform="translate(256,256) scale(4)">
    <g fill="#ffb162">
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(45)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(90)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(135)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(180)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(225)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(270)"/>
      <path d="M0,-6 C3,-14 4,-24 0,-34 C-4,-24 -3,-14 0,-6 Z" transform="rotate(315)"/>
    </g>
    <circle r="5.5" fill="#34485f" stroke="#ffb162" stroke-width="2"/>
  </g>
</svg>
